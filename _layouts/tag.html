---
layout: default
---

<div class="container">
  <h1>Inlägg med taggen: {{ page.tag }}</h1>
  {% assign tag = page.tag %}
  {% for post in site.posts %}
    {% if post.tags contains tag %}
      <article class="post-item">
        <a href="{{ post.url }}">
          <h3>{{ post.title }}</h3>
        </a>
        <div class="post-meta">{{ post.date | date: "%d %B %Y" }}</div>
      </article>
    {% endif %}
  {% endfor %}
</div>
